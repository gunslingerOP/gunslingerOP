# Keeps the Writing list in README.md in step with hasanqaysi.dev's RSS feed. Actions are pinned to commits.
name: Latest writing
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://hasanqaysi.dev/blog/rss.xml"
          max_post_count: 4
          template: "- [$title]($url)$newline"
          commit_message: "Refresh the latest-writing list"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
